defaults:
  - config
  - override hydra/sweeper: optuna
  - _self_

hydra:
  sweeper:
    direction: minimize  
    n_trials: 24
    n_jobs: 1
    
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 5  
    
    params:
      training.learning_rate: tag(log, interval(1e-3, 1e-1))
      training.alpha: interval(0.20, 0.55)
      training.temperature: interval(1.1, 1.9)